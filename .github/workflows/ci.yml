name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lastsize_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d lastsize_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/lastsize_test
      TEST_REDIS_URL: redis://localhost:6379
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY: ci-access
      TEST_S3_SECRET_KEY: ci-secret-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Start S3 storage (SeaweedFS)
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e AWS_ACCESS_KEY_ID=ci-access -e AWS_SECRET_ACCESS_KEY=ci-secret-key \
            chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 2; done
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Migrations match the schema
        run: |
          pnpm --filter @lastsize/db exec drizzle-kit generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t lastsize-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 -t lastsize-web:ci .
      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t lastsize-admin:ci .
