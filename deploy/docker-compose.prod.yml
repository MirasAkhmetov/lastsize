# Production stack for the LastSize server, published through Cloudflare Tunnel.
#   cd deploy && cp .env.production.example .env && (fill in values)
#   docker compose -f docker-compose.prod.yml up -d --build
# No port is open to the internet: cloudflared connects out to Cloudflare and forwards to Caddy.
# Caddy is also on 127.0.0.1:8080 of the host, for checks or a cloudflared already on the host.
# Postgres, Redis, storage and the API live on the private network only.
name: lastsize

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${LOCAL_HTTP_PORT:-8080}:80'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      S3_BUCKET_PUBLIC: lastsize-public
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy

  # Outbound-only connection to Cloudflare; hostnames are set in the Cloudflare dashboard
  # (Zero Trust → Networks → Tunnels → Public hostnames → http://caddy:80).
  # Skip it (COMPOSE_PROFILES without "tunnel") if a cloudflared on the host already serves
  # this server: point its hostnames at http://localhost:8080 instead.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ['tunnel']
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      # A secret: whoever has it can serve traffic for your domain.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
    restart: unless-stopped
    environment:
      <<: *app-env
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      API_INTERNAL_URL: http://api:4000

  # One-off deploy step: applies database migrations and reference data, then exits.
  # The API starts only after it has finished successfully.
  migrate:
    image: lastsize-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    command: ['node', 'node_modules/@lastsize/db/dist/cli/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: lastsize-api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: &api-env
      <<: *app-env
      API_PORT: 4000
      CORS_ORIGINS: https://${SITE_DOMAIN},https://${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set SECRETS_ENCRYPTION_KEY}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: lastsize-public
      S3_BUCKET_PRIVATE: lastsize-private
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      # Optional: Telegram bot for sellers and browser push (empty = switched off).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Background jobs (marketplace stock sync), same image as the API, no HTTP port.
  worker:
    image: lastsize-api:${APP_VERSION:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *api-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=9000', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - storage-data:/data

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  storage-data:
